version: c3-phase3-v1

base_model:
  config_path: src/c3_explanation/configs/qwen_vl_base.yaml
  required_model_id: Qwen/Qwen2.5-VL-7B-Instruct
  required_precision: nf4
  local_files_only: true
  reject_cpu_or_disk_offload: true

lora:
  rank: 32
  alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
  modules_to_save: null
  expected_trainable_parameters: 20185088

prompt:
  version: c3-report-prompt-v1
  system_instruction: >-
    You are the language-reporting Brain in a human-in-the-loop industrial defect
    explanation system. Use the image and the deterministic Bridge facts supplied
    by the user. Output exactly one schema-valid JSON report object, with no
    markdown, commentary, or trailing prose. The Bridge-owned fields
    defect_present, location, severity.level, and severity.affected_area_pct are
    authoritative and must be copied without contradiction. Predict defect_type
    only from the supplied dataset vocabulary. The available corpus supervision
    supports only the categorical recommended action inspect; do not claim that
    another action policy was learned. Descriptive and recommendation language
    requires human verification.
  user_instruction: >-
    Produce the complete defect report. The first content item is the inspection
    image. Applicable defect vocabulary and authoritative Bridge facts follow.
  action_supervision_note: >-
    Corpus action supervision supports only recommended_action.action="inspect".

image:
  min_pixels: 200704
  max_pixels: 3211264
  patch_size: 14
  temporal_patch_size: 2
  merge_size: 2

sequence:
  max_sequence_length: 5120
  truncation: false
  padding: dynamic

data:
  membership_filename: split_membership.json
  report_schema_path: src/c3_explanation/configs/report_schema.yaml
  development_split:
    fraction: 0.10
    seed: 42
    stratify_by:
      - class
      - defect_type
    rounding: half_up
    singleton_policy: training_only
  datasets:
    mvtec_ad:
      corpus_dir: outputs/corpus/c3/mvtec_ad
      dataset_config: src/c3_explanation/configs/datasets/mvtec.yaml
      checkpoint_dir: outputs/checkpoints/c3/mvtec_ad
      mlflow_experiment: c3-train-mvtec_ad
      expected_phase2_train_examples: 1008
      full_max_steps: 378
      full_micro_presentations: 3024
      recovery_checkpoint_steps: 126
    ecf:
      corpus_dir: outputs/corpus/c3/ecf
      dataset_config: src/c3_explanation/configs/datasets/ecf.yaml
      checkpoint_dir: outputs/checkpoints/c3/ecf
      mlflow_experiment: c3-train-ecf
      expected_phase2_train_examples: 2009
      full_max_steps: 754
      full_micro_presentations: 6027
      recovery_checkpoint_steps: 252

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  optimizer: adamw_torch
  scheduler: linear
  warmup_ratio: 0.03
  weight_decay: 0.0
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  bf16: true
  fp16: false
  tf32: false
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  use_cache: false
  num_workers: 0
  remove_unused_columns: false
  logging_nan_inf_filter: false
  seed: 42
  data_seed: 42
  logging_steps: 1
  save_total_limit: 2

stages:
  technical_smoke:
    optimizer_updates: 4
    micro_presentations: 32
    selection_quantiles: 32
  acceptance:
    dataset: mvtec_ad
    optimizer_updates: 20
    micro_presentations: 160
    loss_window: 5
    minimum_loss_values: 20
  full:
    passes: 3

runtime_limits:
  maximum_reserved_vram_fraction: 0.90
  maximum_projected_hours_per_adapter: 12.0

generation:
  max_new_tokens: 384
  do_sample: false
  temperature: 0.0
  num_beams: 1

checkpoint:
  temporary_root: outputs/logs/c3/phase3_temporary_checkpoints
  staging_suffix: .staging
  manifest_filename: phase3_manifest.json

mlflow:
  tracking_uri: file:./outputs/logs/mlflow
  run_stage_names:
    technical_smoke: technical-smoke
    acceptance: acceptance
    full: full
