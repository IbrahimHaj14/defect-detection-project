base_model_id: runwayml/stable-diffusion-inpainting
resolution: 512
scheduler: DDIM
num_inference_steps: 50
guidance_scale: 7.5

# NPI dynamic CFG schedule (arXiv:2604.22850), independently ablatable.
enable_dynamic_cfg: true
guidance_schedule:
  start: 3.0
  end: 8.0
  mode: linear

# Inference-only conditioning canvas motivated by MAGIC (arXiv:2507.02314)
# and GroundingAnomaly (arXiv:2604.08301). Labels remain non-dilated.
mask_dilation_px: 12

dtype: bfloat16
vae_decode_dtype: float32

smoke_test:
  seed: 42
  prompt: a small manufacturing surface defect
  input_gray_value: 128
  mask_box: [192, 192, 320, 320]
  unmasked_mad_tolerance: 0.1
  black_mean_epsilon: 1.0e-6
